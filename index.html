<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0c29">
  <title>Reading Learner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

  <!-- Loading -->
  <div id="screen-loading" class="screen">
    <div class="loading-spinner"></div>
    <p class="loading-text">Getting ready…</p>
    <p id="loading-sub" class="loading-sub">Loading speech engine</p>
  </div>

  <!-- Picker -->
  <div id="screen-picker" class="screen hidden">
    <p class="greeting">What would you like to practise?</p>
    <div class="mode-buttons">
      <button id="btn-mode-words" class="mode-btn">📖 Words</button>
      <button id="btn-mode-numbers" class="mode-btn">🔢 Numbers</button>
    </div>
    <button class="grownup-gate" id="grownup-gate" title="Hold for 2 seconds to open settings" aria-label="Grown-up settings (hold for 2 seconds)">⚙</button>
  </div>

  <!-- Practice -->
  <div id="screen-practice" class="screen hidden">
    <div id="round-progress" class="round-progress" aria-label="Round progress"></div>
    <div id="word-display" class="word-display" aria-live="polite"></div>
    <div class="practice-buttons">
      <button id="hear-button" class="hear-button" aria-label="Hear the word">
        <span class="hear-icon" aria-hidden="true">🔊</span>
        <span class="hear-label">Hear it</span>
      </button>
      <button id="mic-button" class="mic-button" aria-label="Say the word">
        <div class="mic-ripple" aria-hidden="true"></div>
        <span class="mic-icon" aria-hidden="true">🎤</span>
        <span class="mic-status" id="mic-status">Hold and speak</span>
      </button>
    </div>
    <p id="heard-display" class="heard-display"></p>
    <button id="btn-add-heard" class="add-heard-btn hidden"></button>

  </div>

  <!-- All Done -->
  <div id="screen-alldone" class="screen hidden">
    <p class="alldone-title" id="alldone-title">Amazing!</p>
    <p class="alldone-score" id="alldone-score" aria-live="polite"></p>
    <p id="tomorrow-text" class="tomorrow-text">See you again tomorrow!</p>
  </div>

  <!-- Grown-up -->
  <div id="screen-grownup" class="screen hidden">
    <div class="grownup-panel">
      <div class="grownup-header">
        <h2>Settings</h2>
        <button id="btn-back" class="back-btn" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-scroll">

        <section class="settings-group">
          <h3>Practice</h3>
          <label class="setting-row">
            <span>Items per round</span>
            <input type="number" id="s-round-size" min="4" max="20">
          </label>
          <label class="setting-row">
            <span>Retry limit on a miss</span>
            <input type="number" id="s-retry-cap" min="1" max="5">
          </label>
          <label class="setting-row">
            <span>Unaided streak to master</span>
            <input type="number" id="s-mastery-threshold" min="1" max="10">
          </label>
        </section>

        <section class="settings-group">
          <h3>Level Override (grown-up)</h3>
          <div class="settings-level-section">
            <span class="settings-level-label">Words</span>
            <div id="s-word-level-row" class="level-row settings-level-row"></div>
          </div>
          <div class="settings-level-section">
            <span class="settings-level-label">Numbers</span>
            <div id="s-num-level-row" class="level-row settings-level-row"></div>
          </div>
        </section>

        <section class="settings-group">
          <h3>Voice</h3>
          <label class="setting-row">
            <span>Voice</span>
            <select id="s-voice"></select>
          </label>
          <label class="setting-row">
            <span>Speed: <span id="s-rate-value">0.9×</span></span>
            <input type="range" id="s-speech-rate" min="0.5" max="1.5" step="0.1">
          </label>
        </section>

        <section class="settings-group">
          <h3>Progress</h3>
          <div id="progress-grid" class="progress-grid"></div>
          <p id="progress-summary" class="progress-summary"></p>
        </section>

        <section class="settings-group">
          <h3>Custom Words</h3>
          <div class="custom-add-row">
            <input type="text" id="s-custom-word-input" placeholder="e.g. Peppa" maxlength="30" autocomplete="off" autocorrect="off" spellcheck="false">
            <button id="s-custom-word-add" class="custom-add-btn">Add</button>
          </div>
          <div id="s-custom-words-list" class="custom-chip-list"></div>

          <h3 style="margin-top:0.9rem">Custom Numbers</h3>
          <div class="custom-add-row">
            <input type="number" id="s-custom-num-input" placeholder="e.g. 21" min="1" max="999">
            <button id="s-custom-num-add" class="custom-add-btn">Add</button>
          </div>
          <div id="s-custom-nums-list" class="custom-chip-list"></div>
        </section>

        <section class="settings-group danger-group">
          <button id="btn-reset" class="reset-btn">Reset all progress</button>
        </section>

      </div>
    </div>
  </div>

  <!-- Level Up -->
  <div id="screen-levelup" class="screen hidden">
    <div id="levelup-title" class="levelup-title"></div>
    <div id="levelup-body"  class="levelup-body"></div>
    <button id="btn-levelup-continue" class="levelup-continue-btn">Continue →</button>
  </div>

  <!-- Flash overlay (appended by JS) -->

  <script src="vosk/vosk.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
